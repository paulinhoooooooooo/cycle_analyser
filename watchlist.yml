# ================================================================
# Watchlist d'alertes cycliques
# Modifier ce fichier pour ajouter/supprimer des tickers
# Ticker = symbole Yahoo Finance (ex: AAPL, ^SOX, BTC-USD, ^FCHI)
# ================================================================

lookaheadBars: 3   # alerte N barres de trading avant l'événement

alerts:
  - ticker: AAPL
    cycles: "154,120"
    period: 5y
    interval: 1d

  - ticker: SOXQ
    cycles: "154,120"
    period: 5y
    interval: 1d
