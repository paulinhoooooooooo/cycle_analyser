# ================================================================
# Watchlist d'alertes cycliques
# Modifier ce fichier pour ajouter/supprimer des tickers
# Ticker = symbole Yahoo Finance (ex: AAPL, ^SOX, BTC-USD, ^FCHI)
#
# Champs par ticker :
#   ticker   : symbole Yahoo Finance (obligatoire)
#   cycles   : périodes des cycles en barres, séparées par des virgules
#   period   : fenêtre GLISSANTE (1y 2y 5y max) — le début recule chaque jour
#   start    : date de début FIXE — le passé est figé, cycles reproductibles.
#              Si présent, REMPLACE 'period'. Formats acceptés :
#              15/03/2021 (français JJ/MM/AAAA), 2021-03-15 (ISO AAAA-MM-JJ),
#              ou juste 2021 (= 1er janvier). (optionnel)
#   interval : intervalle de bougie (1d 1wk 1mo)
#   direction: long / short / both — filtre les alertes de cette combinaison :
#              long  = uniquement les alignements HAUSSIERS (↑),
#              short = uniquement les alignements BAISSIERS (↓),
#              both  = les deux (défaut si absent). (optionnel)
#
# PLUSIEURS COMBINAISONS PAR TICKER : répéter le bloc avec le même ticker.
# L'ORDRE DANS LE FICHIER fait le classement : la 1re entrée = 🥇 #1
# (combinaison la plus puissante), la 2e = 🥈 #2, etc. Le rang apparaît
# dans les notifications Telegram (/prochains et alertes).
# Exemple :
#   - ticker: ADA-USD          # 🥇 #1 — combinaison principale
#     cycles: "286,164,85"
#     period: 5y
#     interval: 1d
#   - ticker: ADA-USD          # 🥈 #2 — combinaison secondaire
#     cycles: "124,86"
#     period: 5y
#     interval: 1d
# ================================================================

