name: Diagnostic combinaisons

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Symbole Yahoo (ex: REP.MC)"
        required: true
        default: "REP.MC"
        type: string
      start:
        description: "Date de début (JJ/MM/AAAA). Vide = fenêtre 15y."
        required: false
        default: ""
        type: string
      target:
        description: "Périodes cibles (barres), séparées par des virgules."
        required: false
        default: "164,1171"
        type: string

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install numpy pandas yfinance scipy requests
      - env:
          TICKER: ${{ inputs.ticker }}
          START: ${{ inputs.start }}
          TARGET: ${{ inputs.target }}
        run: python diag_combos.py
