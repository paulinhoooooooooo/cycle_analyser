name: Alertes Cycles

on:
  schedule:
    # 19h00 UTC = 21h00 à Paris l'été (heure d'été CEST, UTC+2),
    #             20h00 à Paris l'hiver (CET, UTC+1 — GitHub ne gère pas le
    #             changement d'heure, l'heure est fixe en UTC).
    # 7j/7 pour couvrir aussi les cryptos (BTC, ADA…) négociées le week-end.
    - cron: '0 19 * * *'
  workflow_dispatch:   # déclenchement manuel depuis l'interface GitHub

jobs:
  check-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les alertes et notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_alerts.py
