name: Alertes Cycles

on:
  schedule:
    # 19h07 UTC ≈ 21h07 à Paris l'été (CEST, UTC+2), 20h07 l'hiver (CET, UTC+1).
    # Minute impaire (07) volontaire : les crons « à l'heure pile » sont les plus
    # encombrés chez GitHub et partent souvent avec du retard ; une minute décalée
    # réduit ce retard. GitHub ne gère pas le changement d'heure (UTC fixe).
    # 7j/7 pour couvrir aussi les cryptos (BTC, ADA…) négociées le week-end.
    - cron: '7 19 * * *'
  workflow_dispatch:   # déclenchement manuel depuis l'interface GitHub

permissions:
  contents: write   # pour recommiter cycle_locks.json (verrous J-15)

jobs:
  check-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Mettre à jour les verrous J-15
        run: python update_locks.py

      - name: Vérifier les alertes et notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_alerts.py

      - name: Commiter les verrous si modifiés
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cycle_locks.json
          if git diff --cached --quiet; then
            echo "Verrous inchangés."
          else
            git commit -m "Verrous de cycle (J-15) mis à jour [skip ci]"
            git push
          fi
