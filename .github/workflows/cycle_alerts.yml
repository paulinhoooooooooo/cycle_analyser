name: Alertes Cycles

on:
  schedule:
    # Tous les jours à 21h30 UTC (23h30 Paris été) — 7j/7 pour couvrir aussi
    # les cryptos (BTC, ADA…) qui se négocient le week-end.
    - cron: '30 21 * * *'
  workflow_dispatch:   # déclenchement manuel depuis l'interface GitHub

jobs:
  check-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les alertes et notifier
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_alerts.py
