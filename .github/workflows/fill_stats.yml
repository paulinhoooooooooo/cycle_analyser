name: Remplir les stats watchlist

# À la demande (bouton « Run workflow ») : calcule rendement / zones / réussite
# de CHAQUE combinaison de watchlist.yml puis recommite le fichier complété.
# Tourne sur GitHub → accès à Yahoo Finance (contrairement à l'environnement local).
on:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour recommiter watchlist.yml

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install ruamel.yaml numpy pandas yfinance scipy requests pyyaml

      - name: Calculer et remplir watchlist.yml
        run: python fill_watchlist_stats.py

      - name: Commiter le fichier complété (si modifié)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- watchlist.yml; then
            echo "Aucun changement — rien à commiter."
          else
            git add watchlist.yml
            git commit -m "Auto-remplir rdt/zones/réussite dans watchlist.yml"
            git push
            echo "watchlist.yml mis à jour et poussé."
          fi
