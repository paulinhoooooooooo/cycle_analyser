name: Récap Cycles (prochains)

# Pas d'envoi automatique : uniquement à la demande via le bouton « Run workflow »
# (équivalent manuel de /prochains, pousse le récap complet sur Telegram).
on:
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 6      # sécurité : ne jamais rester bloqué (orange) indéfiniment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances (minimum pour le récap)
        run: pip install requests pyyaml numpy pandas yfinance scipy

      - name: Envoyer le récap des prochains événements
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_digest.py
