name: Test génération rapport

# Vérifie que cycle_analyser.py génère le rapport sans crash (utile pour --asym).
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker Yahoo"
        required: true
        default: "ITW"
      start:
        description: "start (AAAA-MM-JJ ou JJ/MM/AAAA)"
        required: false
        default: "2012-01-01"
      extra:
        description: "Arguments supplémentaires (ex: --asym)"
        required: false
        default: "--asym"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Générer le rapport
        run: |
          python cycle_analyser.py "${{ inputs.ticker }}" --start "${{ inputs.start }}" \
            ${{ inputs.extra }} --no-browser --output report.html
          echo "--- OK : rapport généré ---"
          ls -la report.html
      - name: Diagnostic — cycles asymétriques dans le rapport ?
        run: |
          echo "=== Occurrences du libellé asym (↑U/↓D) dans le HTML ==="
          # Compte les libellés « ↑123/↓45 » et « ↑123 hausse » produits pour les cycles asym.
          N=$(grep -oE '↑[0-9]+/↓[0-9]+|↑[0-9]+ (barres )?hausse' report.html | wc -l || true)
          echo "Nombre de libellés asym trouvés : $N"
          echo "--- Détail (titres de cartes « Cycle … ») ---"
          grep -oE 'Cycle [0-9]+ b · ↑[0-9]+ hausse / ↓[0-9]+ baisse|Cycle [0-9]+ barres' report.html | sort | uniq -c || true
          if [ "$N" -gt 0 ]; then
            echo "✅ Des cycles simples ASYMÉTRIQUES apparaissent bien dans le rapport."
          else
            echo "⚠ Aucun cycle asym affiché : soit --asym absent, soit les cycles symétriques sont plus performants."
          fi
      - name: Publier le rapport (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ inputs.ticker }}
          path: report.html
          retention-days: 7
